# App secrets (AI keys). DO NOT commit a filled-in copy — copy to app-secrets.yaml
# (gitignored) and fill in, then `kubectl apply -f k8s/app-secrets.yaml`.
#
# Or create it directly without a file:
#   kubectl -n stock-ai create secret generic app-secrets \
#     --from-literal=OPENAI_API_KEY=sk-... \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
#
# The backend references these with optional: true, so the app still runs (in mock
# mode) even if this Secret is absent.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: stock-ai
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
