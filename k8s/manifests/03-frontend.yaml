# Streamlit frontend: talks to the backend Service over the cluster network.
# Exposed via NodePort 30851, which the kind config maps to host port 8501.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: stock-ai
data:
  BACKEND_URL: "http://backend:8000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: stock-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: stock-ai-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: frontend-config
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: stock-ai
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30851
