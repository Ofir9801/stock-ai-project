# FastAPI backend: non-secret config in a ConfigMap, DB creds from postgres-secret,
# AI keys from the (optional) app-secrets Secret. DATABASE_URL is assembled from the
# secret parts via Kubernetes $(VAR) interpolation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: stock-ai
data:
  AI_PROVIDER: "auto"
  FRONTEND_ORIGIN: "http://localhost:8501"
  CACHE_TTL_SECONDS: "3600"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stock-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: stock-ai-backend:local
          imagePullPolicy: IfNotPresent  # use the image loaded into kind, don't pull
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            # AI keys are optional: with none set, the app falls back to mock analysis
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: backend-config
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: stock-ai
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
